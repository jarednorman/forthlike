name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # Raylib is built from C source, so its desktop dependencies must be present
  # to compile/link on Linux. (Windows and macOS get theirs from the SDK.)
  # Unquoted on purpose below — the shell word-splits this into separate args.
  LINUX_DEPS: >-
    libasound2-dev libx11-dev libxrandr-dev libxi-dev
    libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev
    libxinerama-dev libwayland-dev libxkbcommon-dev
  # Redirect Zig's global cache (downloaded packages) into the workspace, so a
  # single cache step captures it the same way on every OS.
  ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-global-cache

jobs:
  # Gate: build and run the tests once. If this fails, no artifacts are built.
  # The tests are pure logic, so a single Linux run is enough coverage.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - uses: jdx/mise-action@v4 # installs the zig version from mise.toml
      - uses: actions/cache@v6
        with:
          path: |
            .zig-cache
            .zig-global-cache
          key: zig-test-${{ runner.os }}-${{ hashFiles('build.zig.zon', 'build.zig') }}
          restore-keys: zig-test-${{ runner.os }}-
      - run: zig build test

  # One native runner per platform — far more reliable than cross-compiling,
  # since Raylib pulls in each platform's own windowing/graphics system libs.
  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x86_64
          - os: windows-latest
            artifact: windows-x86_64
          - os: macos-latest
            artifact: macos-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - uses: jdx/mise-action@v4
      - uses: actions/cache@v6
        with:
          path: |
            .zig-cache
            .zig-global-cache
          key: zig-build-${{ runner.os }}-${{ hashFiles('build.zig.zon', 'build.zig') }}
          restore-keys: zig-build-${{ runner.os }}-
      - run: zig build -Doptimize=ReleaseFast
      - uses: actions/upload-artifact@v7
        with:
          name: forthlike-${{ matrix.artifact }}
          path: zig-out/bin/
          if-no-files-found: error
